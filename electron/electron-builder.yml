# electron-builder configuration for HomeStream
#
# Build commands (run from project root):
#   All platforms:  npm run electron:build
#   Windows only:   npm run electron:win
#   macOS only:     npm run electron:mac
#   Linux only:     npm run electron:linux
#
# Output: dist-electron/
#   Windows → HomeStream-Setup-x.x.x.exe  (NSIS installer)
#   macOS   → HomeStream-x.x.x.dmg
#   Linux   → HomeStream-x.x.x.AppImage + .deb

appId: com.homestream.app
productName: HomeStream
copyright: Copyright © 2026 HomeStream

# Bake the GitHub owner/repo into the packaged app so the auto-updater knows
# where to check for new releases.
# updater.cjs reads pkg.build.ghOwner / pkg.build.ghRepo at runtime.
# NOTE: electron-builder only expands its own built-in macros (${version},
# ${productName}, etc.) — it does NOT expand arbitrary env vars in yml values.
# Hardcode the repo coordinates here; they never change.
extraMetadata:
  ghOwner: trevorrossworn-code
  ghRepo: homestream

# ── Auto-updater (electron-updater via GitHub Releases) ───────────────────────
# GH_TOKEN must be set in repo Settings → Secrets → Actions.
# owner/repo are hardcoded — electron-builder yml does not support ${ENV_VAR} expansion.
publish:
  provider: github
  owner: trevorrossworn-code
  repo: homestream
  releaseType: release

# Directories
directories:
  output: dist-electron
  buildResources: electron/assets

# Files to include in the asar package (the Electron app itself).
# NOTE: Do NOT include dist/ here — the client bundle (dist/) and server bundle
# (dist/server.bundle.mjs) are both shipped via extraResources below, which puts
# them outside the asar at resources/client/ and resources/server/. Including
# dist/ here would double-ship ~10MB of client assets inside the asar for no benefit.
files:
  - from: "."
    to: "."
    filter:
      - "electron/main.cjs"
      - "electron/updater.cjs"
      - "electron/preload.cjs"
      - "electron/tray-icon.png"
      - "package.json"
      - "node_modules/electron-updater/**/*"
      - "node_modules/builder-util-runtime/**/*"
      - "node_modules/semver/**/*"

# Extra resources shipped alongside the app (available at process.resourcesPath at runtime)
extraResources:
  # Server bundle — loaded by main.js as a child process
  - from: dist/server.bundle.mjs
    to: server/server.bundle.mjs
  # Client bundle — Vite outputs to dist/client/ (index.html + assets/).
  # We copy dist/client/ to resources/client/ so configure.js can serve it
  # with express.static when running as a packaged Electron app.
  - from: dist/client
    to: client
  # FFmpeg binary — copied into resources/ffmpeg/ so users don't need to install it.
  # ffmpeg-static provides the platform-appropriate binary (ffmpeg.exe on Windows,
  # ffmpeg on macOS/Linux). We use a glob so the build doesn't fail when the
  # platform binary doesn't match the current OS (e.g. building on Linux for Windows).
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - "ffmpeg"
      - "ffmpeg.exe"
  # node_modules — required because the server bundle uses packages: "external"
  # (to avoid esbuild mangling createRequire on Windows). All npm packages are
  # excluded from the bundle and resolved at runtime via NODE_PATH set in main.cjs.
  # We exclude electron itself (not needed at runtime) and heavy dev-only packages.
  - from: node_modules
    to: node_modules
    filter:
      - "!electron/**"
      - "!electron-builder/**"
      - "!esbuild/**"
      - "!vite/**"
      - "!vitest/**"
      - "!@vitejs/**"
      - "!@playwright/**"
      - "!@testing-library/**"
      - "!typescript/**"
      - "!eslint/**"
      - "!prettier/**"
      - "!postcss/**"
      - "!tailwindcss/**"
      - "!autoprefixer/**"
      - "!jsdom/**"
      - "!tsx/**"

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    # Full NSIS installer — creates Start Menu + Desktop shortcuts, uninstallable
    # This is the primary deliverable: HomeStream-Setup-x.x.x.exe inside a ZIP.
    - target: nsis
      arch: [x64]
  # electron-builder auto-converts icon.png → .ico if no .ico is provided
  icon: electron/assets/icon.png
  #
  # ── Code Signing (v1.2 — activate when cert is ready) ──────────────────────
  # Without a valid Authenticode cert, Windows Defender SmartScreen will show
  # a "Windows protected your PC" warning on first run. Users can click
  # "More info → Run anyway" to bypass it, but it erodes trust.
  #
  # Recommended path: Certum Open Source Code Signing (free for OSS projects)
  #   https://www.certum.eu/en/cert_offer_en_open_source_cs.xml
  #
  # Once you have a PFX cert:
  #   1. Add the PFX as a GitHub Actions secret: WIN_CSC_LINK (base64-encoded)
  #   2. Add the password as: WIN_CSC_KEY_PASSWORD
  #   3. Uncomment the four lines below
  #   4. Add to release.yml env block:
  #        WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
  #        WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
  #
  # certificateSubjectName: "HomeStream"
  # signingHashAlgorithms: [sha256]
  # rfc3161TimeStampServer: http://timestamp.certum.pl
  # signDlls: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HomeStream
  runAfterFinish: true
  # Delta updates — only downloads the diff between versions, not the full installer.
  # This means users get updates in seconds (a few MB) instead of minutes (full ~150MB installer).
  # electron-builder generates a .nsis.7z delta package alongside the full installer.
  differentialPackage: true

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  # electron-builder auto-converts icon.png → .icns on macOS
  icon: electron/assets/icon.png
  category: public.app-category.entertainment
  darkModeSupport: true

dmg:
  title: HomeStream
  window:
    width: 540
    height: 380

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  icon: electron/assets/icon.png
  category: AudioVideo
  description: Self-hosted media streaming server
  desktop:
    entry:
      Name: HomeStream
      Comment: Stream your personal media collection
      Categories: AudioVideo;Video;Player;
