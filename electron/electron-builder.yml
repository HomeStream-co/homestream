# electron-builder configuration for HomeStream
#
# Build commands:
#   Windows:  npx electron-builder --win   --publish never
#   macOS:    npx electron-builder --mac   --publish never
#   Linux:    npx electron-builder --linux --publish never
#
# Output: dist-electron/
#   Windows → HomeStream-Setup-x.x.x.exe  (NSIS installer)
#   macOS   → HomeStream-x.x.x.dmg
#   Linux   → HomeStream-x.x.x.AppImage

appId: com.homestream.app
productName: HomeStream
copyright: Copyright © 2025 HomeStream

# No auto-updater — users download new versions manually

# Directories
directories:
  output: dist-electron
  buildResources: electron/assets

# Files to include in the package
files:
  - dist/**/*
  - electron/main.js
  - electron/preload.js
  - electron/tray-icon.png
  - package.json

# Server bundle shipped as an extra resource
extraResources:
  - from: dist/server.bundle.mjs
    to: server/server.bundle.mjs
  - from: dist/server.bundle.mjs.map
    to: server/server.bundle.mjs.map
    filter: ["**/*"]

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64, ia32]
  icon: electron/assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HomeStream
  runAfterFinish: true

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: electron/assets/icon.icns
  category: public.app-category.entertainment
  darkModeSupport: true

dmg:
  title: HomeStream
  background: electron/assets/dmg-background.png
  window:
    width: 540
    height: 380

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  icon: electron/assets/icon.png
  category: AudioVideo
  description: Self-hosted media streaming server
  desktop:
    Name: HomeStream
    Comment: Stream your personal media collection
    Categories: AudioVideo;Video;Player;
