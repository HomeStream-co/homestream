# electron-builder configuration for HomeStream
#
# Build commands (run from project root):
#   All platforms:  npm run electron:build
#   Windows only:   npm run electron:win
#   macOS only:     npm run electron:mac
#   Linux only:     npm run electron:linux
#
# Output: dist-electron/
#   Windows → HomeStream-Setup-x.x.x.exe  (NSIS installer)
#   macOS   → HomeStream-x.x.x.dmg
#   Linux   → HomeStream-x.x.x.AppImage + .deb

appId: com.homestream.app
productName: HomeStream
copyright: Copyright © 2026 HomeStream

# The server bundle (dist/server.bundle.cjs) is fully self-contained — all
# node_modules are inlined by esbuild. The only node_modules shipped in the
# asar are pure-JS packages (electron-updater, builder-util-runtime, semver).
# Disabling npmRebuild prevents @electron/rebuild from attempting to
# cross-compile native addons (bufferutil, utf-8-validate) from source, which
# always fails when building Windows .exe from a Linux CI host.
npmRebuild: false

# Bake the GitHub owner/repo into the packaged app so the auto-updater knows
# where to check for new releases.
# updater.cjs reads pkg.build.ghOwner / pkg.build.ghRepo at runtime.
# NOTE: electron-builder only expands its own built-in macros (${version},
# ${productName}, etc.) — it does NOT expand arbitrary env vars in yml values.
# Hardcode the repo coordinates here; they never change.
extraMetadata:
  ghOwner: trevorrossworn-code
  ghRepo: homestream

# ── Auto-updater (electron-updater via GitHub Releases) ───────────────────────
# GH_TOKEN must be set in repo Settings → Secrets → Actions.
# owner/repo are hardcoded — electron-builder yml does not support ${ENV_VAR} expansion.
publish:
  provider: github
  owner: trevorrossworn-code
  repo: homestream
  releaseType: release

# Directories
directories:
  output: dist-electron
  buildResources: electron/assets

# Files to include in the asar package (the Electron app itself).
# NOTE: Do NOT include dist/ here — the client bundle (dist/) and server bundle
# (dist/server.bundle.mjs) are both shipped via extraResources below, which puts
# them outside the asar at resources/client/ and resources/server/. Including
# dist/ here would double-ship ~10MB of client assets inside the asar for no benefit.
files:
  - from: "."
    to: "."
    filter:
      - "electron/main.cjs"
      - "electron/updater.cjs"
      - "electron/preload.cjs"
      - "electron/tray-icon.png"
      - "package.json"
      - "node_modules/electron-updater/**/*"
      - "node_modules/builder-util-runtime/**/*"
      - "node_modules/semver/**/*"

# Extra resources shipped alongside the app (available at process.resourcesPath at runtime)
extraResources:
  # Server bundle — CJS format, all node_modules inlined. No external node_modules needed.
  - from: dist/server.bundle.cjs
    to: server/server.bundle.cjs
  # Sourcemap for crash diagnostics
  - from: dist/server.bundle.cjs.map
    to: server/server.bundle.cjs.map
  # Client bundle — Vite outputs to dist/client/ (index.html + assets/).
  - from: dist/client
    to: client
  # FFmpeg binary
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - "ffmpeg"
      - "ffmpeg.exe"

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    # zip target — packages the unpacked Electron app into a .zip archive.
    # Does not require NSIS or 7zip toolchain, so it builds cleanly from Linux CI.
    # Users extract and run HomeStream.exe.
    # Switch to nsis when building from a Windows host or with wine+7zip.
    - target: zip
      arch: [x64]
  # Disable forced code signing — no cert available.
  forceCodeSigning: false
  # Skip rcedit (icon/resource patching of the .exe). rcedit requires
  # winCodeSign which needs 7zip to extract — 7zip is a glibc binary that
  # cannot run on Alpine (musl). The .exe will use the default Electron icon
  # until this is built on a Windows host or with wine+7zip available.
  signAndEditExecutable: false
  # electron-builder auto-converts icon.png → .ico if no .ico is provided
  icon: electron/assets/icon.png

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  # electron-builder auto-converts icon.png → .icns on macOS
  icon: electron/assets/icon.png
  category: public.app-category.entertainment
  darkModeSupport: true

dmg:
  title: HomeStream
  window:
    width: 540
    height: 380

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  icon: electron/assets/icon.png
  category: AudioVideo
  description: Self-hosted media streaming server
  desktop:
    entry:
      Name: HomeStream
      Comment: Stream your personal media collection
      Categories: AudioVideo;Video;Player;
