# HomeStream CI
#
# Runs on every push and pull request to main/develop.
# Three jobs run in parallel:
#   type-check  - tsc --noEmit
#   lint        - eslint
#   test        - vitest (867 unit tests)
#
# A fourth job (build-check) depends on all three and does a full
# Vite production build to catch any bundler-level errors.

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/RELEASE.md'
      - 'CHANGELOG.md'
      - 'INSTALL.md'
      - 'README.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Type checking ------------------------------------------------------------
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  # -- Linting ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # -- Tests --------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # -- Production build check ---------------------------------------------------
  build-check:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Suppress Vite's interactive prompts in CI
          CI: true

  # -- Smoke test ---------------------------------------------------------------
  # Starts the production build and hits the critical API endpoints to verify
  # the server boots and responds correctly — catches wiring regressions that
  # unit tests can't (missing route registrations, startup crashes, etc.)
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Start server in background
        run: |
          node dist/server.bundle.mjs &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: production
          PORT: 3000
          # Smoke test runs against a fresh install — setup is not complete,
          # which is fine: /api/health and auth endpoints work regardless.
          HOMESTREAM_DATA_DIR: /tmp/homestream-smoke

      - name: Run smoke tests
        run: node scripts/smoke-test.mjs http://localhost:3000

      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true
