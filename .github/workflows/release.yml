name: Release

# Triggered by pushing a version tag: git tag v1.5.8 && git push origin v1.5.8
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#
# Re-tag cycle (rebuild same version):
#   git tag -d v1.5.8 && git push origin --delete v1.5.8
#   git tag v1.5.8 && git push origin v1.5.8
#
# Artifacts uploaded:
#   1. HomeStream-Setup-*.exe  — NSIS installer (for real installs / auto-updater)
#   2. HomeStream-Portable-*.exe — portable single-file exe (for quick testing)
#
# The portable build finishes ~5 min faster than NSIS — grab it first for smoke tests.
# IMPORTANT: Only the NSIS installer supports auto-updater. Never use portable for real installs.

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Windows build & publish ─────────────────────────────────────────────────
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do NOT use actions/setup-node cache here — we manage it manually
          # below with a Windows-specific key to avoid cross-OS cache poisoning.

      # ── node_modules cache (Windows-specific key) ──────────────────────────
      # Key includes runner.os so a Linux cache never restores on Windows.
      # restore-keys intentionally omitted — partial cross-OS match would break native modules.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: Windows-node22-modules-${{ hashFiles('package-lock.json') }}

      # ── Install (only if cache missed) ────────────────────────────────────
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          npm_config_optional: true

      # ── Delete existing GitHub Release so electron-builder can recreate it ─
      - name: Delete existing GitHub Release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Checking for existing release for tag: $TAG"
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RESPONSE" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ] && [ "$RELEASE_ID" != "" ]; then
            echo "Deleting existing release id=$RELEASE_ID for tag $TAG"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted."
          else
            echo "No existing release found for $TAG — proceeding"
          fi

      # ── Build Vite + server bundle ─────────────────────────────────────────
      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # ── Verify build artifacts ─────────────────────────────────────────────
      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== dist/ top-level ==="
          ls -lh dist/ || { echo "ERROR: dist/ missing"; exit 1; }
          echo ""
          echo "=== dist/client/ ==="
          ls dist/client/ | head -15 || { echo "ERROR: dist/client/ missing"; exit 1; }
          echo ""
          echo "=== server bundle ==="
          if [ -f dist/server.bundle.cjs ]; then
            ls -lh dist/server.bundle.cjs
            echo "✓ server.bundle.cjs present"
          else
            echo "ERROR: dist/server.bundle.cjs MISSING — build failed"
            exit 1
          fi

      # ── Package: NSIS installer + publish to GitHub Release ───────────────
      # This is the ONLY build that supports auto-updater.
      # It publishes latest.yml + HomeStream-Setup-*.exe to the GitHub Release.
      # electron-builder creates the release automatically via GH_TOKEN.
      - name: Package & publish NSIS installer
        run: >
          npx electron-builder
          --win
          --config electron/electron-builder.yml
          --config.win.target=nsis
          --publish always
          --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder

      # ── Upload NSIS installer as artifact (safety net if publish fails) ────
      - name: Upload NSIS installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn

      # ── Package: Portable (fast smoke-test — NO auto-updater support) ─────
      # Built AFTER NSIS so the real installer is already published.
      # Grab this from artifacts for quick "does it boot?" testing.
      - name: Package portable .exe (smoke-test only)
        if: always()
        run: >
          npx electron-builder
          --win
          --config electron/electron-builder.yml
          --config.win.target=portable
          --publish never
          --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Portable-${{ github.ref_name }}
          path: dist-electron/*Portable*.exe
          retention-days: 14
          if-no-files-found: warn
