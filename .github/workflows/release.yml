name: Release

# Triggered by pushing a version tag: git tag v1.5.2 && git push origin v1.5.2
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#
# Re-tag cycle (rebuild same version):
#   git tag -d v1.5.2 && git push origin --delete v1.5.2
#   git tag v1.5.2 && git push origin v1.5.2

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Delete any existing release for this tag so electron-builder can
      # create it fresh. This handles the re-tag cycle cleanly — without this,
      # electron-builder silently fails to upload assets when the release
      # already exists (even as a draft).
      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ]; then
            echo "Deleting existing release id=$RELEASE_ID for tag $TAG"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          else
            echo "No existing release found for $TAG — proceeding"
          fi

      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Package & publish installer
        # Runs on windows-latest — NSIS produces a proper .exe installer.
        # --publish always → creates the GitHub Release and uploads assets.
        run: npx electron-builder --win --config electron/electron-builder.yml --config.win.target=nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Code signing — uncomment when WIN_CSC_LINK secret is added:
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Safety net: upload the installer as an Actions artifact even if the
      # GitHub Release publish step fails.
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn
