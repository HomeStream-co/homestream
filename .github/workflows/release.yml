name: Release

# Triggered by pushing a version tag: git tag v1.3.7 && git push origin v1.3.7
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#               (used by electron-builder to create the GitHub Release)
#
# GH_OWNER and GH_REPO are auto-derived from the repository context.
# You do NOT need to set them as secrets — they are read directly from
# github.repository_owner and github.event.repository.name below.
# (The old pattern `${{ secrets.X || github.Y }}` is invalid YAML/Actions syntax
#  and silently resolves to empty string when the secret is not set.)
#
# Re-tag cycle (if you need to rebuild the same version):
#   git tag -d v1.3.7
#   git push origin --delete v1.3.7
#   git tag v1.3.7
#   git push origin v1.3.7

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Package & publish installer
        # Runs on windows-latest — NSIS is available, so we override the default
        # zip target (used for local Linux builds) with nsis to produce a proper
        # .exe installer for end-users.
        # --publish always → creates/updates the GitHub Release and uploads assets.
        # GH_TOKEN must be set in repo Settings → Secrets → Actions.
        run: npx electron-builder --win --config electron/electron-builder.yml --config.win.target=nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # signAndEditExecutable defaults to true on Windows — rcedit works fine
          # on windows-latest so the app icon will be patched into the .exe.
          # Code signing — uncomment when WIN_CSC_LINK secret is added:
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Safety net: upload the installer as an Actions artifact even if the
      # GitHub Release publish step fails (e.g. token scope issue).
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn
