name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate NSIS images
        run: node scripts/resize-nsis-images.mjs

      - name: Build app
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --config electron/electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HOMESTREAM_GH_OWNER: ${{ secrets.GH_OWNER }}
          HOMESTREAM_GH_REPO: ${{ secrets.GH_REPO }}
