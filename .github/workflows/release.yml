      # ── Package: NSIS installer + publish to GitHub Release ───────────────
      # This is the ONLY build that supports auto-updater.
      # It publishes latest.yml + HomeStream-Setup-*.exe to the GitHub Release.
      # electron-builder creates the release automatically via GH_TOKEN.
      - name: Package & publish NSIS installer
        run: >
          npx electron-builder
          --win
          --config electron/electron-builder.yml
          --config.win.target=nsis
          --publish always
          --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder

      # ── Upload NSIS installer as artifact (safety net if publish fails) ────
      - name: Upload NSIS installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn

      # ── Package: Portable (fast smoke-test — NO auto-updater support) ─────
      # Built AFTER NSIS so the real installer is already published.
      # Grab this from artifacts for quick "does it boot?" testing.
      - name: Package portable .exe (smoke-test only)
        if: always()
        run: >
          npx electron-builder
          --win
          --config electron/electron-builder.yml
          --config.win.target=portable
          --publish never
          --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Portable-${{ github.ref_name }}
          path: dist-electron/*Portable*.exe
          retention-days: 14
          if-no-files-found: warn
