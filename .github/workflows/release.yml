name: Release

# Triggered by pushing a version tag: git tag v1.5.7 && git push origin v1.5.7
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#
# Re-tag cycle (rebuild same version):
#   git tag -d v1.5.7 && git push origin --delete v1.5.7
#   git tag v1.5.7 && git push origin v1.5.7
#
# Artifacts uploaded:
#   1. HomeStream-Setup-*.exe  — NSIS installer (for real installs / auto-updater)
#   2. HomeStream-Portable-*.exe — portable single-file exe (for quick testing)
#
# The portable build finishes ~5 min faster than NSIS — grab it first for smoke tests.

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Windows build & publish ─────────────────────────────────────────────────
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Restore node_modules cache ─────────────────────────────────────────
      # Caches the full node_modules dir keyed on package-lock.json hash.
      # On a cache hit npm ci is skipped entirely, saving 3-5 min per run.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-modules-

      # ── Install (only if cache missed) ────────────────────────────────────
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          npm_config_optional: true

      # ── Delete existing release so electron-builder can create it fresh ───
      - name: Delete existing GitHub Release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Checking for existing release for tag: $TAG"
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RESPONSE" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ] && [ "$RELEASE_ID" != "" ]; then
            echo "Deleting existing release id=$RELEASE_ID for tag $TAG"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted."
          else
            echo "No existing release found for $TAG — proceeding"
          fi

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # ── Verify artifacts ───────────────────────────────────────────────────
      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== dist/ top-level ==="
          ls -lh dist/ || { echo "ERROR: dist/ missing"; exit 1; }
          echo ""
          echo "=== dist/client/ ==="
          ls dist/client/ | head -15 || { echo "ERROR: dist/client/ missing"; exit 1; }
          echo ""
          echo "=== server bundle ==="
          if [ -f dist/server.bundle.cjs ]; then
            ls -lh dist/server.bundle.cjs
            echo "✓ server.bundle.cjs present"
          else
            echo "ERROR: dist/server.bundle.cjs MISSING — build failed"
            exit 1
          fi

      # ── Package: Portable (fast — grab this first for smoke testing) ───────
      # Portable builds in ~3 min vs ~8 min for NSIS.
      # Does NOT support auto-updater — use NSIS installer for production.
      - name: Package portable .exe (fast smoke-test build)
        run: npx electron-builder --win --config electron/electron-builder.yml --config.win.target=portable --publish never --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Portable-${{ github.ref_name }}
          path: dist-electron/*Portable*.exe
          retention-days: 14
          if-no-files-found: warn

      # ── Package: NSIS installer + publish to GitHub Release ───────────────
      - name: Package & publish NSIS installer
        run: npx electron-builder --win --config electron/electron-builder.yml --config.win.target=nsis --publish always --extraMetadata.ghToken=${{ secrets.GH_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder

      # ── Safety-net artifact upload ─────────────────────────────────────────
      - name: Upload NSIS installer artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*.zip
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn
