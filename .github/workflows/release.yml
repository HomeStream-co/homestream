name: Release

# Triggered by pushing a version tag: git tag v1.5.2 && git push origin v1.5.2
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#
# Re-tag cycle (rebuild same version):
#   git tag -d v1.5.2 && git push origin --delete v1.5.2
#   git tag v1.5.2 && git push origin v1.5.2

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Install ────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        env:
          # Suppress optional native rebuild failures (bufferutil, utf-8-validate)
          npm_config_optional: true

      # ── Delete existing release so electron-builder can create it fresh ───
      - name: Delete existing GitHub Release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Checking for existing release for tag: $TAG"
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          echo "API response: $RESPONSE" | head -5
          RELEASE_ID=$(echo "$RESPONSE" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ] && [ "$RELEASE_ID" != "" ]; then
            echo "Deleting existing release id=$RELEASE_ID for tag $TAG"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted."
          else
            echo "No existing release found for $TAG — proceeding"
          fi

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # ── Verify artifacts ───────────────────────────────────────────────────
      - name: Verify build artifacts
        shell: bash
        run: |
          echo "=== dist/ top-level ==="
          ls -lh dist/ || { echo "ERROR: dist/ missing"; exit 1; }
          echo ""
          echo "=== dist/client/ ==="
          ls dist/client/ | head -15 || { echo "ERROR: dist/client/ missing"; exit 1; }
          echo ""
          echo "=== server bundle ==="
          if [ -f dist/server.bundle.cjs ]; then
            ls -lh dist/server.bundle.cjs
            echo "✓ server.bundle.cjs present"
          else
            echo "ERROR: dist/server.bundle.cjs MISSING — build failed"
            exit 1
          fi
          echo ""
          echo "=== sourcemap (optional) ==="
          ls -lh dist/server.bundle.cjs.map 2>/dev/null && echo "✓ sourcemap present" || echo "(no sourcemap — OK)"

      # ── Package & publish ──────────────────────────────────────────────────
      - name: Package & publish Windows installer
        # --publish always → creates the GitHub Release and uploads the .exe
        run: npx electron-builder --win --config electron/electron-builder.yml --config.win.target=nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder
          # Code signing — uncomment when WIN_CSC_LINK secret is added:
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # ── Safety-net artifact upload ─────────────────────────────────────────
      # Uploads the .exe to Actions artifacts even if the GitHub Release
      # publish step fails — so you can always download it manually.
      - name: Upload installer artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn
