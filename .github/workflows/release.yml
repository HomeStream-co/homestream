# ── HomeStream Release Workflow ───────────────────────────────────────────────
#
# Triggers on any tag push matching v* (e.g. v1.1.0, v2.0.0-beta.1).
#
# What it does:
#   1. Builds the React frontend + Express server bundle (npm run build)
#   2. Packages a Windows NSIS installer via electron-builder
#   3. Creates a GitHub Release and uploads the .exe as a release asset
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   GH_TOKEN        — Personal Access Token with `repo` scope. Used by
#                     electron-builder to create the release and upload assets.
#                     Generate at: https://github.com/settings/tokens
#   GH_OWNER        — Your GitHub username or org (e.g. "john-doe").
#                     Baked into the .exe so the auto-updater knows where to
#                     check for new releases. Must match the repo owner exactly.
#   GH_REPO         — Your GitHub repo name (e.g. "homestream").
#                     Baked into the .exe alongside GH_OWNER.
#
# Optional secrets:
#   TMDB_API_KEY    — Baked in as a default; users can override in setup wizard.
#
# How to trigger a release:
#   git tag v1.1.0
#   git push origin v1.1.0
#
# The workflow will:
#   - Build on windows-latest (required for Windows .exe + correct ffmpeg binary)
#   - Produce:  dist-electron/HomeStream-Setup-1.1.0.exe
#   - Create:   GitHub Release "v1.1.0" with the .exe attached
#   - Users with auto-updater will be notified of the new release automatically

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Release Windows .exe
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      # Must run on Windows so ffmpeg-static downloads the Windows ffmpeg.exe.
      # A node_modules copied from macOS/Linux has the wrong binary.
      - name: Install dependencies
        run: npm ci

      # ── 4. Regenerate NSIS branding images ───────────────────────────────────
      # Ensures header (150×57) and sidebar (164×314) PNGs are valid before
      # electron-builder tries to embed them in the installer.
      - name: Generate NSIS branding images
        run: node scripts/resize-nsis-images.mjs

      # ── 5. Build frontend + server bundle ────────────────────────────────────
      - name: Build app
        run: npm run build

      # ── 6. Package Windows installer ─────────────────────────────────────────
      # --publish always  → electron-builder creates the GitHub Release and
      #                     uploads the .exe + latest.yml (used by auto-updater).
      # GH_TOKEN is passed via env so electron-builder can authenticate.
      # HOMESTREAM_GH_OWNER + HOMESTREAM_GH_REPO are read by updater.js at
      # runtime to know which GitHub repo to poll for new releases.
      # They must be baked in at build time — the yml config is not shipped.
      - name: Package Windows installer
        run: npx electron-builder --win --config electron/electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HOMESTREAM_GH_OWNER: ${{ secrets.GH_OWNER }}
          HOMESTREAM_GH_REPO: ${{ secrets.GH_REPO }}

      # ── 7. Upload artifact (backup — also available in GitHub Release) ────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-${{ github.ref_name }}
          path: dist-electron/HomeStream-Setup-*.exe
          retention-days: 30

      # ── 8. Annotate the GitHub Release with auto-generated release notes ──────
      # Generates a changelog from commits since the last tag and appends it to
      # the release body that electron-builder created. Users see a real changelog
      # instead of an empty release page.
      - name: Generate release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Find the release electron-builder just created
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5,
            });
            const release = releases.data.find(r => r.tag_name === tag);
            if (!release) { console.log('Release not found — skipping notes'); return; }

            // Generate notes from GitHub's built-in changelog generator
            const notes = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
            });

            // Prepend install instructions then append the changelog
            const body = [
              '## Install',
              '',
              `Download **HomeStream-Setup-${tag.replace('v','')}.exe** below and run it.`,
              'Windows may show a SmartScreen warning — click **More info → Run anyway**.',
              '',
              '## What\'s Changed',
              '',
              notes.data.body,
            ].join('\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body,
            });
            console.log(`Release notes updated for ${tag}`);

