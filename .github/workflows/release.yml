name: Release on: push: tags: - 'v*' jobs: release-windows: name: Build & Release Windows .exe runs-on: windows-latest steps: - name: Checkout repository uses: actions/checkout@v4 - name: Set up Node.js 20 uses: actions/setup-node@v4 with: node-version: '20' cache: 'npm' - name: Install dependencies run: npm ci - name: Generate NSIS branding images run: node scripts/resize-nsis-images.mjs - name: Build app run: npm run build - name: Package Windows installer run: npx electron-builder --win --config electron/electron-builder.yml --publish always env: GH_TOKEN: ${{ secrets.GH_TOKEN }} HOMESTREAM_GH_OWNER: ${{ secrets.GH_OWNER }} HOMESTREAM_GH_REPO: ${{ secrets.GH_REPO }} - name: Upload installer artifact uses: actions/upload-artifact@v4 with: name: HomeStream-Windows path: dist-electron/HomeStream-Setup-*.exe retention-days: 30