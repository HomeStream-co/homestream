name: Release

# Triggered by pushing a version tag: git tag v1.3.6 && git push origin v1.3.6
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   GH_TOKEN  — GitHub Personal Access Token with repo + write:packages scope
#               (used by electron-builder to create the GitHub Release)
#
# Optional (auto-detected from github.repository if not set):
#   GH_OWNER  — GitHub username/org (e.g. trevorrossworn-code)
#   GH_REPO   — Repository name (e.g. homestream)
#
# Re-tag cycle (if you need to rebuild the same version):
#   git pull origin main
#   git tag -d v1.3.6
#   git push origin --delete v1.3.6
#   git tag v1.3.6
#   git push origin v1.3.6

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite + server bundle)
        run: npm run build
        env:
          CI: true

      - name: Package & publish installer
        # electron-builder reads publish config from electron/electron-builder.yml.
        # --publish always → creates/updates the GitHub Release and uploads assets.
        run: npx electron-builder --win -c electron/electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Owner/repo — fall back to the current repo context if secrets aren't set
          HOMESTREAM_GH_OWNER: ${{ secrets.GH_OWNER || github.repository_owner }}
          HOMESTREAM_GH_REPO: ${{ secrets.GH_REPO || github.event.repository.name }}
          # Code signing — uncomment when WIN_CSC_LINK secret is added
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Safety net: upload the installer as an Actions artifact even if the
      # GitHub Release publish step fails (e.g. token scope issue).
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeStream-Windows-Installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
          retention-days: 30
          if-no-files-found: warn
