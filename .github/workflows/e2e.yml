name: E2E Tests (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Use a known test password — override in repo secrets for real installs
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'homestream' }}
      SETUP_COMPLETE: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Verify dev server starts
        run: |
          npx vite --port 5173 &
          SERVER_PID=$!
          echo "Vite PID: $SERVER_PID"
          # Wait up to 60s for the server to respond
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Dev server is up after ${i}s"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Dev server did not start in 60s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        env:
          SETUP_COMPLETE: 'true'
          NODE_ENV: test

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: 'http://localhost:5173'
          VITE_PORT: '5173'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: playwright-results/
          retention-days: 7
